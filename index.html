<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="深海潜水艇驾驶舱 · 舱载 AI 全息球与灵动轮询小脸 bot，融合程序化瓷器与黄铜机械美学。"
    />
    <meta name="theme-color" content="#0a1926" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1926'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23c7973f' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%2308b9a9' stroke-width='1.2' opacity='0.7'/%3E%3Crect x='30' y='2' width='4' height='6' rx='1.5' fill='%23c7973f'/%3E%3Crect x='28' y='2' width='8' height='3' rx='1' fill='%23ffd84d'/%3E%3Ccircle cx='32' cy='35' r='14' fill='%2308c77a'/%3E%3Cellipse cx='28' cy='33' rx='3.2' ry='4.5' fill='%23ffffff'/%3E%3Cellipse cx='36' cy='33' rx='3.2' ry='4.5' fill='%23ffffff'/%3E%3Ccircle cx='23' cy='38' r='2' fill='%2379e2d0' opacity='0.8'/%3E%3Ccircle cx='41' cy='38' r='2' fill='%2379e2d0' opacity='0.8'/%3E%3C/svg%3E" />
    <meta property="og:title" content="深海潜艇舱载 Bot · 3D 全息舱载数字生命" />
    <meta
      property="og:description"
      content="深海潜水艇驾驶舱 · 舱载 AI 全息球与灵动轮询小脸 bot。"
    />
    <meta
      property="og:image"
      content="https://sub.liuwa.xyz/assets/how-code-becomes-real.png"
    />
    <title>深海潜艇舱载 Bot · 3D 全息舱载数字生命</title>
  </head>
  <body>
    <canvas id="scene" aria-label="可交互的程序化瓷器与黄铜潜水艇"></canvas>

    <header class="brand">
      <p>PROCEDURAL THREE.JS STUDY</p>
      <h1>Vibe Submarine</h1>
      <span>Porcelain · Brass · Glass · Code</span>
    </header>

    <aside class="controls" aria-label="场景控制">
      <div class="control-group">
        <span class="control-label">VIEW</span>
        <button class="is-active" data-mode="final">最终效果</button>
        <button data-mode="topology">装配线框</button>
        <button data-mode="hull-loft">船体放样</button>
        <button data-mode="no-glass">隐藏玻璃</button>
      </div>
      <div class="control-group control-actions">
        <button id="pause" aria-pressed="false">暂停动画</button>
        <button id="reset">重置视角</button>
      </div>
      <div class="control-group" data-bot-group>
        <span class="control-label">BOT</span>
        <button id="bot-next-mood">换心情</button>
        <button id="bot-pause">bot 暂停</button>
        <button id="bot-color">换颜色</button>
        <button id="bot-showcase">表情秀</button>
        <button id="bot-view">看 bot</button>
      </div>
      <p class="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 点击舱内面板摸头</p>
    </aside>

    <div class="metrics" aria-live="polite">
      <span><b id="fps">--</b> FPS</span>
      <span><b id="draws">--</b> DRAWS</span>
      <span><b id="triangles">--</b> TRIS</span>
    </div>

    <div id="loading" class="loading">
      <div class="loader" aria-hidden="true"></div>
      <p>正在生成潜水艇几何与材质…</p>
    </div>

    <div id="error" class="error" role="alert" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
